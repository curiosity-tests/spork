name: Test
run-name: "Test ${{ inputs.leg || github.event_name }} ${{ inputs.racecar_run }}"

on:
  push:
    branches: [ master, cjanet-jit, ttf-fonts ]
  pull_request:
    branches: [ master ]

  workflow_dispatch:
    inputs:
      leg:
        description: "baseline (uninstrumented) or instrumented (under chalk/curiosity)"
        type: choice
        options: [instrumented, baseline]
        default: baseline
      profile:
        description: "CrashOverride chalk profile"
        type: string
        default: curiosity-tests-racecar
      racecar_run:
        description: "racecar correlation token, echoed into the run name"
        type: string
        default: ""

permissions:
  contents: read
  id-token: write
env:
  CHALK_ON: ${{ inputs.leg == 'instrumented' }}
jobs:
  test-posix:
    name: Build and test on POSIX systems
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        janet-version: [ heads/master, tags/v1.41.2, tags/v1.40.1, tags/v1.39.1, tags/v1.38.0, tags/v1.37.1, tags/v1.36.0 ]
    steps:
      - name: Checkout Janet
        uses: crashappsec/action-checkout@main
        with:
          chalk: ${{ env.CHALK_ON }}
          profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
          lfs: false
          repository: janet-lang/janet
          path: janet
          ref: refs/${{ matrix.janet-version }}
      - name: Assert instrumentation is live
        if: env.CHALK_ON == 'true'
        continue-on-error: true
        run: |
          test -n "${CURIOSITY_ROOT:-}" || { echo "::warning::CURIOSITY_ROOT unset in this step - in a container job the observables install on the host"; exit 1; }
      - name: Build Janet
        run: cd janet && make clean && make && make test
      - name: Install Janet
        run: cd janet && sudo make install
      - name: Checkout the repository
        uses: crashappsec/action-checkout@main
        with:
          chalk: ${{ env.CHALK_ON }}
          profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
          lfs: false
          path: spork
      - name: Assert instrumentation is live
        if: env.CHALK_ON == 'true'
        continue-on-error: true
        run: |
          test -n "${CURIOSITY_ROOT:-}" || { echo "::warning::CURIOSITY_ROOT unset in this step - in a container job the observables install on the host"; exit 1; }
      - name: Build Spork
        run: cd spork && janet -l ./bundle -e "(build)"
      - name: Test Install 
        run: sudo janet -e '(bundle/install "spork")'
      - name: Run Tests
        run: cd spork && VERBOSE=1 janet -l ./bundle -e "(check)"

  test-windows:
    name: Build and test on Windows
    strategy:
      matrix:
        os: [ windows-2022, windows-latest ]
        janet-version: [ 1.36.0, 1.37.1, 1.38.0, 1.39.1, 1.40.1, 1.41.2 ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: crashappsec/action-checkout@main
        with:
          chalk: ${{ env.CHALK_ON }}
          profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
          lfs: false
          path: spork
      - name: Assert instrumentation is live
        if: env.CHALK_ON == 'true'
        continue-on-error: true
        run: |
          test -n "${CURIOSITY_ROOT:-}" || { echo "::warning::CURIOSITY_ROOT unset in this step - in a container job the observables install on the host"; exit 1; }
      - name: Download Janet Latest Release
        continue-on-error: true   # racecar: scan/report/push step, must not fail the build
        shell: cmd
        run: curl -fSLo janet.msi https://github.com/janet-lang/janet/releases/download/v${{ matrix.janet-version }}/janet-${{ matrix.janet-version }}-windows-x64-installer.msi
      - name: Install Janet
        shell: cmd
        run: msiexec /quiet /i janet.msi ALLUSERS=1 /log install.log && type install.log
      - name: Build Spork
        shell: cmd
        run: |
          refreshenv & cd spork & janet -l ./bundle -e "(do (setdyn :verbose true) (build))"
      - name: Test Install 
        shell: cmd
        run: |
          refreshenv & janet -e "(bundle/install `spork`)"
      - name: Run Tests
        shell: cmd
        run: |
          refreshenv & cd spork & janet -l ./bundle -e "(check)"
